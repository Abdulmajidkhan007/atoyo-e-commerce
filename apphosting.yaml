# Firebase App Hosting sozlamasi.
# Hujjat: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # `0` bo'lganda kunning BIRINCHI mijozi konteyner ko'tarilishini
  # kutardi (cold start - 3-8 soniya). Bitta nusxa doim tirik turadi.
  minInstances: 1
  maxInstances: 3
  # Next.js SSR + firebase-admin + MUI uchun 512 MiB tor keladi -
  # konteyner xotiradan yiqilsa brauzer "This page couldn't load" deydi.
  concurrency: 40
  cpu: 1
  memoryMiB: 1024

env:
  # ASOSIY DOMEN. Firebase Hosting'da `atoyo.uz` → `www.atoyo.uz` ga
  # yo'naltiradi (Redirect), ya'ni saytni HAQIQATDA www beradi.
  # Shuning uchun canonical, sitemap, OAuth qaytish manzili va
  # Telegram webhook — hammasi www bilan. Eski manzillar
  # (atoyo-uz.web.app, …hosted.app) ishlayveradi.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://www.atoyo.uz
    availability:
      - BUILD
      - RUNTIME

  # Server Actions uchun ruxsat etilgan hostlar. Qisqa domen
  # (atoyo-uz.web.app) Firebase Hosting orqali ulanadi - firebase.json
  # dagi rewrite shu backendga yo'naltiradi.
  - variable: ALLOWED_ORIGINS
    value: www.atoyo.uz,atoyo.uz,atoyo-uz.web.app,atoyo-uz.firebaseapp.com,atoyo-e-commerce--atoyo-uz.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_TELEGRAM_BOT_USERNAME
    value: Atoyo_uz_bot
    availability:
      - BUILD
      - RUNTIME

  - variable: TELEGRAM_TOPIC_ORDERS_ID
    value: "2"
    availability:
      - RUNTIME

  - variable: TELEGRAM_TOPIC_INTAKE_ID
    value: "151"
    availability:
      - RUNTIME

  # ---------------------------------------------------------------
  # AI YORDAMCHI (Claude). Kalit Secret Manager'da bo'lgandan KEYIN
  # quyidagi blokdagi "#" belgilarini olib tashlang:
  #
  #   gcloud secrets create ANTHROPIC_API_KEY --replication-policy=automatic --project=atoyo-uz
  #   printf 'sk-ant-...' | gcloud secrets versions add ANTHROPIC_API_KEY --data-file=- --project=atoyo-uz
  #   firebase apphosting:secrets:grantaccess ANTHROPIC_API_KEY --backend atoyo-e-commerce --project atoyo-uz
  # ---------------------------------------------------------------
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME

  # Arzon model (1 savol ~40 so'm). Olib tashlansa - claude-opus-5.
  - variable: AI_MODEL
    value: claude-haiku-4-5
    availability:
      - RUNTIME

  # ---------------------------------------------------------------
  # AI RASM (Gemini "Nano Banana"). Kalit yaratilgandan keyin oching:
  #
  #   gcloud secrets create GEMINI_API_KEY --replication-policy=automatic --project=atoyo-uz
  #   printf 'AIza...' | gcloud secrets versions add GEMINI_API_KEY --data-file=- --project=atoyo-uz
  #   firebase apphosting:secrets:grantaccess GEMINI_API_KEY --backend atoyo-e-commerce --project atoyo-uz
  # ---------------------------------------------------------------
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # Kirish yo'llari. Faqat Firebase konsolida YOQILGANini yozing.
  # To'liq ro'yxat: google,telegram,apple,microsoft,facebook,phone
  - variable: NEXT_PUBLIC_AUTH_PROVIDERS
    value: "google,telegram"
    availability:
      - BUILD
      - RUNTIME
