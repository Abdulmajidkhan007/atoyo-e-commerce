# Firebase App Hosting sozlamasi.
# Hujjat: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://atoyo-e-commerce--atoyo-uz.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: ALLOWED_ORIGINS
    value: atoyo-e-commerce--atoyo-uz.us-east4.hosted.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_TELEGRAM_BOT_USERNAME
    value: Atoyo_uz_bot
    availability:
      - BUILD
      - RUNTIME

  - variable: TELEGRAM_TOPIC_ORDERS_ID
    value: "2"
    availability:
      - RUNTIME

  - variable: TELEGRAM_TOPIC_INTAKE_ID
    value: "151"
    availability:
      - RUNTIME
