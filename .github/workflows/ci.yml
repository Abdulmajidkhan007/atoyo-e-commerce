name: CI

# Har qanday branch'ga push bo'lganda ishlaydi. Avval tez tekshiruv
# (quality), u o'tsagina APK yig'iladi - buzuq koddan APK chiqmaydi.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # 1) TEKSHIRUV (~1-3 daq): sayt va ilova uchun typecheck + lint.
  #    Tekshiruv = typecheck + lint + testlar (vitest) + build.
  # ---------------------------------------------------------------------
  quality:
    name: Tekshiruv (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sayt paketlari
        run: npm ci

      - name: Sayt - typecheck
        run: npx tsc --noEmit

      - name: Sayt - lint
        run: npx eslint .

      - name: Sayt - testlar
        run: npm test

      - name: Sayt - build
        run: npm run build

      - name: Ilova paketlari
        working-directory: mobile
        run: npm ci

      - name: Ilova - typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Ilova - lint
        working-directory: mobile
        run: npx eslint 'src/**/*.ts' 'src/**/*.tsx' --no-ignore

      # Native kutubxona versiyasi RN codegen'i bilan mos kelmasa, Gradle
      # build 3 daqiqadan keyin yiqiladi. Bu qadam o'sha xatoni bir necha
      # soniyada, Android SDK'siz topadi.
      - name: Ilova - codegen tekshiruvi
        working-directory: mobile
        run: npm run check-codegen

  # ---------------------------------------------------------------------
  # 2) ANDROID APK (~13-15 daq). Bu RELEASE build: JS bundle APK ichiga
  #    joylanadi, shuning uchun Metro'siz, mustaqil ishlaydi.
  #
  #    Imzo: hozircha debug kaliti bilan (test uchun o'rnatsa bo'ladi).
  #    Play Store uchun o'z keystore'ingiz va `bundleRelease` (AAB) kerak -
  #    ATOYO_KEYSTORE_* secretlari qo'shilgach shu yerga qo'shiladi.
  #
  #    APK ikki joyga chiqadi:
  #      • artifakt (`atoyo-apk`) - PR va debug uchun, 14 kun;
  #      • ochiq Release (`latest` tegi) - portfolio/sayt havolasi uchun,
  #        muddatsiz va GitHub akkauntisiz yuklab olinadi.
  # ---------------------------------------------------------------------
  android-apk:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Release yaratish (teg + asset) uchun yozish huquqi kerak.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle keshi
        uses: gradle/actions/setup-gradle@v4

      - name: Ilova paketlari
        working-directory: mobile
        run: npm ci

      # google-services.json repoda saqlanmaydi (repo ochiq) - u
      # GOOGLE_SERVICES_JSON secret'idan olinadi. Faylning O'ZINI (JSON
      # matnini) yopishtirish yetarli; base64 ko'rinishi ham qabul qilinadi.
      # Qo'shish: Settings -> Secrets and variables -> Actions -> New secret.
      - name: Firebase konfiguratsiyasi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret'i yo'q. Firebase konsolida Android ilova qo'shing (package: com.atoyo) va google-services.json mazmunini shu secret'ga yopishtiring."
            exit 1
          fi
          TARGET=mobile/android/app/google-services.json
          # Oddiy JSON bo'lsa - shundayligicha; base64 bo'lsa - ochiladi.
          if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$TARGET"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > "$TARGET"
          fi
          node -e "
            const file = 'mobile/android/app/google-services.json';
            const json = JSON.parse(require('fs').readFileSync(file, 'utf8'));
            const names = (json.client || []).map(c => c.client_info.android_client_info.package_name);
            console.log('Fayldagi paket nomlari:', names.join(', ') || '(yo\'q)');
            // Gradle applicationId bilan mos kelmasa, :app:processReleaseGoogleServices
            // 3 daqiqadan keyin yiqiladi - shu sababdan hozir tekshiramiz.
            if (!names.includes('com.atoyo')) {
              console.error('::error::google-services.json da com.atoyo yo\'q. Firebase konsolida Add app -> Android qilib package nomini ANIQ com.atoyo deb kiriting, yangi faylni yuklab olib GOOGLE_SERVICES_JSON secret\'iga qayta yopishtiring.');
              process.exit(1);
            }
            console.log('google-services.json OK');
          "

      # "Google orqali kirish" uchun web client ID (client_type: 3) -
      # maxfiy emas, lekin har loyihada boshqacha. Uni shu yerda
      # google-services.json dan chiqarib, ilova kodiga yozib qo'yamiz.
      # Topilmasa - tugma ilovada ko'rinmaydi, build esa davom etadi.
      - name: Google kirish sozlamasi
        run: |
          node -e "
            const fs = require('fs');
            const json = JSON.parse(fs.readFileSync('mobile/android/app/google-services.json', 'utf8'));
            const ids = (json.client || [])
              .flatMap(c => c.oauth_client || [])
              .filter(o => o.client_type === 3)
              .map(o => o.client_id);
            const id = ids[0] ?? '';
            if (!id) {
              console.log('::warning::google-services.json da web client (client_type: 3) yo\'q - Google orqali kirish tugmasi ko\'rinmaydi. Firebase konsolida Authentication -> Sign-in method -> Google ni yoqing va faylni qayta yuklab oling.');
            } else {
              console.log('Web client ID topildi.');
            }
            const file = 'mobile/src/google-config.ts';
            const source = fs.readFileSync(file, 'utf8');
            fs.writeFileSync(file, source.replace(/export const GOOGLE_WEB_CLIENT_ID = '.*';/, \"export const GOOGLE_WEB_CLIENT_ID = '\" + id + \"';\"));
          "

      - name: Release APK yig'ish
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK'ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: atoyo-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

      # Ochiq Release: doimiy havola
      #   https://github.com/<owner>/<repo>/releases/latest/download/app-release.apk
      # Faqat default branch'ga push'da ishlaydi (PR'da emas), `latest`
      # tegi har build'da shu commit'ga ko'chiriladi va asset almashtiriladi.
      # Fayl nomi app-release.apk bo'lib qolishi SHART - havola shunga bog'liq.
      - name: Ochiq Release (latest)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: mobile/android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          NOTES=$(printf '%s\n' \
            "Atoyo Android ilovasi - avtomatik build." \
            "" \
            "- Commit: \`${GITHUB_SHA}\`" \
            "- Sana: ${BUILD_DATE}" \
            "- Branch: \`${GITHUB_REF_NAME}\`" \
            "" \
            "Yuklab olish: [app-release.apk](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-release.apk)" \
            "" \
            "APK debug kaliti bilan imzolangan - o'rnatishda \"Noma'lum manbalar\" ruxsati kerak.")

          # Ko'chuvchi "latest" tegini joriy commit'ga o'tkazamiz. API
          # orqali - checkout sayoz (shallow) bo'lgani uchun teg push'i
          # har doim ham o'tmaydi.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --target "$GITHUB_SHA" --title "Atoyo ilovasi (oxirgi build)" --notes "$NOTES" --latest
            gh release upload latest "$APK" --clobber
          else
            gh release create latest "$APK" --target "$GITHUB_SHA" --title "Atoyo ilovasi (oxirgi build)" --notes "$NOTES" --latest
          fi

  # ---------------------------------------------------------------------
  # 3) FIRESTORE QOIDALARI VA INDEKSLARI (~1 daq).
  #
  #    `firestore.rules` va `firestore.indexes.json` repoda turadi, lekin
  #    ilgari ular faqat qo'lda (Cloud Shell orqali) qo'llanardi. Endi
  #    default branch'ga push bo'lganda avtomatik deploy qilinadi.
  #
  #    Kerak: FIREBASE_SERVICE_ACCOUNT secret'i - Firebase konsolida
  #    Project settings -> Service accounts -> "Generate new private key"
  #    tugmasi bilan olingan JSON faylning MAZMUNI. Secret qo'yilmagan
  #    bo'lsa bu ish jimgina o'tkazib yuboriladi (CI qizarmaydi).
  # ---------------------------------------------------------------------
  firestore-rules:
    name: Firestore qoidalari
    needs: quality
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Qoidalar va indekslarni deploy qilish
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_ACCOUNT}" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret'i yo'q - qoidalar deploy qilinmadi."
            exit 0
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project atoyo-uz \
            --non-interactive
